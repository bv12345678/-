<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול מלאי והזמנות - אדמין</title>
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="preconnect" href="https://script.google.com" crossorigin>
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#1A1C2C',
                        gold: '#C5A059'
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #0b1f3a;
            color: #e0e0e0;
        }
        .serif { font-family: 'Rubik', sans-serif; font-weight: 900; }
        .gold-gradient { background: linear-gradient(135deg, #C5A059 0%, #F1D27B 50%, #C5A059 100%); }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #C5A059;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s ease-in-out infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #toast { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            transform: translateY(150%); 
            transition: transform 0.3s ease; 
            z-index: 1000; 
            background-color: #1A1C2C; 
            color: white; 
            padding: 1rem 1.5rem; 
            border-radius: 1rem; 
            border-right: 4px solid #C5A059; 
        }
        #toast.show { transform: translateY(0); }
        .full-page-loader {
            position: fixed;
            inset: 0;
            background-color: rgba(26, 28, 44, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="min-h-screen text-right">

    <div id="full-page-loader" class="full-page-loader hidden">
        <div class="loader mb-4"></div>
        טוען נתונים...
    </div>

    <div id="toast" class="shadow-2xl flex items-center gap-3">
        <i data-lucide="info" class="text-gold"></i>
        <span id="toast-msg"></span>
    </div>

    <!-- 1. מסך התחברות (Login Screen) -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-[#1e1e1e] border border-zinc-800 rounded-[2rem] w-full max-w-md p-8 shadow-2xl text-center space-y-6">
            <div class="w-16 h-16 gold-gradient rounded-2xl flex items-center justify-center shadow-md mx-auto">
                <i data-lucide="lock" class="text-[#0b1f3a] w-8 h-8"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-[#f5d37a] serif">ניהול מערכת ומלאי</h1>
                <p class="text-xs text-zinc-400 mt-2">הכניסה מורשית למנהלי מערכת בלבד</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="admin-password-input" placeholder="הזן סיסמת מנהל" required
                    class="w-full p-4 bg-zinc-800/80 rounded-2xl border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-gold focus:border-transparent text-center text-white">
                <button type="submit" class="w-full py-4 gold-gradient text-navy font-bold rounded-2xl shadow-lg transition-transform hover:scale-[1.01] active:scale-95">
                    התחבר למערכת
                </button>
            </form>
        </div>
    </div>

    <!-- 2. לוח הבקרה הראשי (Dashboard Panel) - מוסתר כברירת מחדל -->
    <div id="admin-dashboard" class="hidden min-h-screen flex flex-col bg-zinc-950">
        <!-- תפריט עליון קבוע באדמין -->
        <nav class="sticky top-0 z-50 bg-[#1e1e1e] border-b border-zinc-800 px-4 md:px-8 py-5 shadow-lg">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 gold-gradient rounded-xl flex items-center justify-center shadow-md">
                        <i data-lucide="settings" class="text-[#0b1f3a] w-5 h-5"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold serif text-[#f5d37a]" id="brand-title">מערכת ניהול</h2>
                        <p class="text-[9px] uppercase tracking-wider text-zinc-500">Inventory & Orders Dashboard</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                    <button id="admin-back-inv" onclick="renderAdminTable()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-[#f5d37a] rounded-xl text-xs font-bold transition-colors hidden">חזור לניהול פריטים</button>
                    <button id="admin-view-toggle" onclick="showOrdersHistory()" class="px-4 py-2 bg-[#132f55] text-[#f5d37a] rounded-xl hover:bg-zinc-800 text-xs font-bold transition-colors">היסטוריית הזמנות</button>
                    <button onclick="handleLogout()" class="p-2 text-red-400 bg-red-950/20 rounded-full hover:bg-red-900/30 transition-colors" title="התנתק"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                </div>
            </div>
        </nav>

        <main class="flex-1 max-w-7xl mx-auto w-full p-4 md:p-8">
            <div id="admin-content" class="bg-[#1e1e1e] rounded-[2rem] border border-zinc-800 p-6 md:p-10 shadow-xl"></div>
        </main>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby4f1QrovCOzIo8v3nhIfvhnjKGdh8Wh0vK4RZgPUkaPewzG2HTF8Wudh4GqUu0P79q/exec';
        const DEFAULT_IMG = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="%23cccccc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
        
        let inventory = [];
        let adminPassword = "";

        async function handleLogin(e) {
            e.preventDefault();
            const passInput = document.getElementById('admin-password-input');
            const pass = passInput.value.trim();
            if (!pass) return;

            showToast('בודק הרשאות...');
            const loader = document.getElementById('full-page-loader');
            loader.classList.remove('hidden');

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "login", password: pass })
                });
                const result = await response.json();

                if (result.status === "success") {
                    adminPassword = pass;
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('admin-dashboard').classList.remove('hidden');
                    
                    // טעינת המלאי פעם ראשונה לאחר כניסה
                    await fetchInventory();
                    showToast('התחברת בהצלחה ללוח המנהל');
                } else {
                    showToast('סיסמה שגויה!');
                }
            } catch (e) {
                console.error(e);
                showToast('שגיאה בהתחברות למערכת');
            } finally {
                loader.classList.add('hidden');
            }
        }

        function handleLogout() {
            adminPassword = "";
            document.getElementById('admin-password-input').value = "";
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            showToast('התנתקת בהצלחה');
        }

        async function fetchInventory() {
            const loader = document.getElementById('full-page-loader');
            loader.classList.remove('hidden');

            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                
                const rawInventory = data.Inventory || data['מלאי'] || data.מלאי || [];
                inventory = rawInventory.map(i => ({
                    ...i,
                    status: (i['תיאור_אפשרי'] && i['תיאור_אפשרי'].trim().toLowerCase() === 'hidden') ? 'hidden' : 'active',
                    מלאי: parseInt(i.מלאי || i['מלאי'] || 0)
                }));

                const aboutConfig = data.About || data['אודות'] || data.אודות || {};
                const name = aboutConfig['שם המקום'] || 'מערכת ניהול מלאי';
                document.getElementById('brand-title').innerText = name + " - ניהול";

                renderAdminTable();
            } catch (e) { 
                console.error(e);
                showToast('שגיאה בטעינת הנתונים מהשרת'); 
            } finally {
                loader.classList.add('hidden');
            }
        }

        function formatImageUrl(url) {
            if (!url) return DEFAULT_IMG;
            if (url.includes('drive.google.com') || url.includes('docs.google.com')) {
                let id = '';
                try {
                    if (url.includes('id=')) {
                        id = url.split('id=')[1].split('&')[0];
                    } else if (url.includes('/d/')) {
                        id = url.split('/d/')[1].split('/')[0];
                    }
                } catch (e) {}
                if (id) return `https://lh3.googleusercontent.com/d/${id}=w800-rw`;
            }
            return url;
        }

        function escapeHtmlParam(str) {
            if (!str) return '';
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function getVariationColumns() {
            if (inventory.length === 0) return [];
            const cols = new Set();
            inventory.forEach(item => {
                Object.keys(item).forEach(k => {
                    if (k.startsWith('וריאציה_')) { cols.add(k); }
                });
            });
            return Array.from(cols);
        }

        function renderAdminTable() {
            document.getElementById('admin-back-inv').classList.add('hidden');
            const content = document.getElementById('admin-content');
            const varCols = getVariationColumns();
            
            const varInputsHTML = varCols.map(col => {
                const cleanName = col.replace('וריאציה_', '');
                return `<input type="text" id="new-${col}" placeholder="${cleanName}" class="p-3 bg-zinc-800/60 border border-zinc-700 text-white rounded-xl text-sm outline-none text-right">`;
            }).join('');

            content.innerHTML = `
                <div id="admin-form" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-12 p-6 bg-zinc-900/50 rounded-3xl border border-dashed border-zinc-800">
                    <input type="hidden" id="edit-id">
                    <input type="text" id="new-name" placeholder="שם פריט" class="p-3 bg-zinc-800/60 border border-zinc-700 text-white rounded-xl text-sm outline-none text-right">
                    <input type="number" id="new-qty" placeholder="מלאי" class="p-3 bg-zinc-800/60 border border-zinc-700 text-white rounded-xl text-sm outline-none text-right">
                    <input type="text" id="new-cat" placeholder="קטגוריה" class="p-3 bg-zinc-800/60 border border-zinc-700 text-white rounded-xl text-sm outline-none text-right">
                    <input type="text" id="new-img" placeholder="קישור תמונה" class="p-3 bg-zinc-800/60 border border-zinc-700 text-white rounded-xl text-sm outline-none text-right">
                    ${varInputsHTML}
                    <button onclick="saveItem()" id="save-btn" class="gold-gradient rounded-xl font-bold py-4 text-zinc-950 shadow-md md:col-span-4 transition-transform hover:scale-[1.01] active:scale-95">שמור פריט</button>
                </div>
                <div id="admin-table-list" class="space-y-3"></div>`;
            
            const list = document.getElementById('admin-table-list');
            list.innerHTML = inventory.map((item, idx) => {
                const isHidden = item.status === 'hidden';
                const itemVarKeys = Object.keys(item).filter(k => k.startsWith('וריאציה_') && item[k]);
                const varBadges = itemVarKeys.map(k => {
                    return `<span class="text-[10px] bg-gold/10 text-gold px-2 py-0.5 rounded-lg border border-gold/20 font-bold ml-1">${k.replace('וריאציה_', '')}: ${item[k]}</span>`;
                }).join('');

                const itemPNameEscaped = escapeHtmlParam(item['שם_פריט']);
                return `
                <div class="flex flex-col sm:flex-row items-center gap-4 p-4 bg-zinc-900 border border-zinc-800 rounded-2xl hover:border-gold/30 transition-colors ${isHidden ? 'opacity-50' : ''}">
                    <img src="${formatImageUrl(item['תמונה'])}" onerror="this.src='${DEFAULT_IMG}'" class="w-16 h-16 rounded-lg object-cover border border-zinc-800">
                    <div class="flex-1 text-right w-full sm:w-auto">
                        <div class="font-bold text-sm text-white">${item['שם_פריט']} (מלאי: ${item.מלאי})</div>
                        <div class="flex flex-wrap gap-1 mt-1">${varBadges}</div>
                        ${isHidden ? '<div class="mt-1"><span class="text-[9px] bg-zinc-800 px-2 py-0.5 rounded text-zinc-500">מוסתר מהקטלוג</span></div>' : ''}
                    </div>
                    <div class="flex gap-2 justify-end w-full sm:w-auto">
                        <button onclick="toggleItemVisibility('${itemPNameEscaped}', '${item.status}')" class="p-2 hover:bg-zinc-800 rounded-lg text-white" title="${isHidden ? 'הצג' : 'הסתר'}">
                            <i data-lucide="${isHidden ? 'eye-off' : 'eye'}" class="w-4 h-4 ${isHidden ? 'text-zinc-500' : 'text-gold'}"></i>
                        </button>
                        <button onclick="editItem(${idx})" class="p-2 hover:bg-zinc-800 rounded-lg text-white"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                        <button onclick="deleteItem('${itemPNameEscaped}')" class="p-2 text-red-500 hover:bg-red-950/20 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>`;
            }).join('');
            try { if (window.lucide) lucide.createIcons(); } catch (e) {}
        }

        async function toggleItemVisibility(name, currentStatus) {
            const newStatus = currentStatus === 'hidden' ? 'active' : 'hidden';
            const item = inventory.find(i => i['שם_פריט'] === name);
            if (item) item.status = newStatus;
            
            renderAdminTable();
            
            try {
                await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({
                        action: "editItem", 
                        password: adminPassword, 
                        שם_פריט: name, 
                        status: newStatus,
                        old_name: name,
                        מלאי: item.מלאי,
                        קטגוריה: item['קטגוריה'],
                        תמונה: item['תמונה']
                    }) 
                });
            } catch (e) { showToast('שגיאה בעדכון הסטטוס בשרת'); }
        }

        async function showOrdersHistory() {
            document.getElementById('admin-back-inv').classList.remove('hidden');
            const content = document.getElementById('admin-content');
            const loader = document.getElementById('full-page-loader');
            loader.classList.remove('hidden');

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "getOrders", password: adminPassword })
                });
                
                const resData = await response.json();
                if (resData.status !== "success") {
                    content.innerHTML = `<div class="py-20 text-center opacity-50 text-gold font-bold">שגיאת אבטחה או חוסר הרשאות</div>`;
                    return;
                }

                const orders = resData.orders || resData['הזמנות'] || resData.הזמנות || [];
                if (orders.length === 0) {
                    content.innerHTML = `<div class="py-20 text-center opacity-50 text-gold font-bold">אין הזמנות רשומות במערכת</div>`;
                    return;
                }

                let html = `
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h3 class="font-bold text-lg serif text-gold">היסטוריית הזמנות מפורטת</h3>
                        <button onclick="renderAdminTable()" class="px-5 py-2.5 gold-gradient text-zinc-950 rounded-xl text-xs font-bold shadow-md hover:scale-[1.01] transition-transform">חזור לניהול פריטים</button>
                    </div>
                    <div class="overflow-x-auto rounded-2xl border border-zinc-800 shadow-sm">
                        <table class="w-full text-sm border-collapse bg-zinc-900 text-white">
                            <thead class="bg-zinc-800 text-gold text-right">
                                <tr>
                                    <th class="p-4 border-b border-zinc-700 text-right">לקוח</th>
                                    <th class="p-4 border-b border-zinc-700 text-right">טלפון</th>
                                    <th class="p-4 border-b border-zinc-700 text-center">התחלה</th>
                                    <th class="p-4 border-b border-zinc-700 text-center">סיום</th>
                                    <th class="p-4 border-b border-zinc-700 text-right">פריטים</th>
                                    <th class="p-4 border-b border-zinc-700 text-center">קוד הזמנה</th>                            
                                </tr>
                            </thead>
                            <tbody>`;
                
                const sortedOrders = [...orders].reverse();

                sortedOrders.forEach(o => {
                    const cleanPickup = (o.תאריך_לקיחה || o['תאריך_לקיחה'] || "").split('T')[0].split(' ')[0];
                    const cleanReturn = (o.תאריך_החזרה || o['תאריך_החזרה'] || "").split('T')[0].split(' ')[0];
                    const code = o.קוד_הזמנה || o['קוד_הזמנה'] || o.orderCode || '---';

                    html += `
                        <tr class="border-b border-zinc-800 hover:bg-zinc-800/40 transition-colors text-right">
                            <td class="p-4 font-bold">${o.שם_לקוח || o['שם_לקוח']}</td>
                            <td class="p-4 font-mono text-xs text-zinc-400">${o.טלפון || o['טלפון']}</td>
                            <td class="p-4 text-center text-xs bg-zinc-950/20 font-bold">${cleanPickup}</td>
                            <td class="p-4 text-center text-xs bg-zinc-950/20 font-bold">${cleanReturn}</td>
                            <td class="p-4 text-[11px] leading-relaxed max-w-xs text-right">${(o.פריטים || o['פריטים'] || "").replace(/, /g, '<br>')}</td>
                            <td class="p-4 text-center font-bold text-gold bg-zinc-950/30">${code}</td>
                        </tr>`;
                });
                
                html += `</tbody></table></div>`;
                content.innerHTML = html;
                try { if (window.lucide) lucide.createIcons(); } catch (e) {}
            } catch (e) {
                showToast('שגיאה בטעינת ההיסטוריה');
            } finally {
                loader.classList.add('hidden');
            }
        }

        async function saveItem() {
            const name = document.getElementById('new-name').value;
            const qty = document.getElementById('new-qty').value;
            if(!name || !qty) return showToast('נא למלא שם ומלאי');

            const varCols = getVariationColumns();
            const payload = {
                action: document.getElementById('edit-id').value ? "editItem" : "addItem",
                password: adminPassword, 
                שם_פריט: name,
                מלאי: qty,
                קטגוריה: document.getElementById('new-cat').value,
                תמונה: document.getElementById('new-img').value,
                old_name: document.getElementById('edit-id').value,
                status: 'active'
            };

            varCols.forEach(col => {
                const inputEl = document.getElementById(`new-${col}`);
                if (inputEl) { payload[col] = inputEl.value || ""; }
            });
            
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerText = 'שומר...';

            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                await fetchInventory(); 
                renderAdminTable();
                showToast('הפריט נשמר בהצלחה');
            } catch(e) {
                showToast('שגיאה בשמירה');
            } finally {
                btn.disabled = false;
                btn.innerText = 'שמור פריט';
            }
        }

        function editItem(idx) {
            const i = inventory[idx];
            document.getElementById('new-name').value = i['שם_פריט'] || '';
            document.getElementById('new-qty').value = i.מלאי || 0;
            document.getElementById('new-cat').value = i['קטגוריה'] || '';
            document.getElementById('new-img').value = i['תמונה'] || '';
            document.getElementById('edit-id').value = i['שם_פריט'] || '';
            
            const varCols = getVariationColumns();
            varCols.forEach(col => {
                const inputEl = document.getElementById(`new-${col}`);
                if (inputEl) { inputEl.value = i[col] || ''; }
            });

            document.getElementById('save-btn').innerText = 'עדכן שינויים';
            document.getElementById('admin-form').scrollIntoView({behavior:'smooth'});
        }

        async function deleteItem(name) {
            if (confirm('האם אתה בטוח שברצונך למחוק מוצר זה לצמיתות?')) {
                const loader = document.getElementById('full-page-loader');
                loader.classList.remove('hidden');
                try {
                    await fetch(SCRIPT_URL, { 
                        method: 'POST', 
                        body: JSON.stringify({ action: "deleteItem", password: adminPassword, שם_פריט: name }) 
                    });
                    await fetchInventory(); 
                    renderAdminTable();
                    showToast('המוצר נמחק בהצלחה');
                } catch(e) {
                    showToast('שגיאה במחיקת פריט');
                } finally {
                    loader.classList.add('hidden');
                }
            }
        }

        function showToast(m) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = m;
            t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            try { if (window.lucide) lucide.createIcons(); } catch (e) {}
        });
    </script>
</body>
</html>
